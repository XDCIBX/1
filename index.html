<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UpHill">
<meta name="theme-color" content="#0b0d12">
<title>UpHill</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{
  --bg:#0b0d12; --card:#151922; --card2:#1c2230; --line:#262d3d;
  --text:#eef1f7; --muted:#8a93a6; --gold:#f5c451; --gold2:#ffdf8a;
  --green:#34d399; --red:#f87171; --blue:#60a5fa; --purple:#a78bfa;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.35}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 10px) 16px 10px}
.top-row{display:flex;align-items:center;gap:12px}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2b3550,#1a2033);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;border:2px solid var(--gold)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--muted);font-size:12.5px}
.cash{text-align:right}
.mbtn{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:17px;flex:none}
.cash b{display:block;font-size:19px;color:var(--green);font-variant-numeric:tabular-nums}
.cash b.neg{color:var(--red)}
.cash span{color:var(--muted);font-size:12px}
.mini-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}
.ms{font-size:11px;color:var(--muted)}
.ms i{font-style:normal}
.bar{height:5px;border-radius:3px;background:#262d3d;overflow:hidden;margin-top:3px}
.bar>div{height:100%;border-radius:3px}

main{padding:14px 16px calc(150px + var(--safe-b));max-width:720px;margin:0 auto}
h2{font-size:21px;margin:18px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:16px;margin:16px 0 8px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--card2);font-size:12px;color:var(--muted);margin:2px 4px 2px 0;white-space:nowrap}
.pill.g{color:var(--green);background:rgba(52,211,153,.12)}
.pill.r{color:var(--red);background:rgba(248,113,113,.12)}
.pill.y{color:var(--gold);background:rgba(245,196,81,.12)}
.pill.b{color:var(--blue);background:rgba(96,165,250,.12)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:40px}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--gold),#e8a93a);color:#1b1405;border:0}
.btn.grn{background:rgba(52,211,153,.16);color:var(--green);border-color:rgba(52,211,153,.35)}
.btn.red{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.3)}
.btn.blu{background:rgba(96,165,250,.14);color:var(--blue);border-color:rgba(96,165,250,.3)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.sm{padding:7px 10px;min-height:32px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* photo */
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,#27304a,#141a29);border-radius:14px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;background:radial-gradient(circle at 30% 20%,#3a4670,#151b2c 70%)}
.ph.r169{aspect-ratio:16/10}
.ph.sq{width:64px;height:64px;flex:none;border-radius:12px}
.ph.sq .emo{font-size:30px}
.ph.hero{aspect-ratio:16/9;border-radius:18px}
.ph .tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px 9px;border-radius:999px;font-size:12px;font-weight:600}
.ph .tag.own{background:rgba(52,211,153,.85);color:#04281b}

/* shop grid */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item .ph{border-radius:0}
.item .body{padding:12px 13px 13px}
.item .name{font-weight:700;font-size:16px}
.item .price{font-weight:800;color:var(--gold);font-size:17px;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.item .desc{color:var(--muted);font-size:13px;margin-bottom:6px}

/* actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grp{display:flex;align-items:center;gap:8px;width:100%;margin:16px 0 8px;padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);text-align:left}
.grp span{font-weight:700;font-size:16px;flex:1}
.grp small{color:var(--muted);font-size:12px}
.grp i{font-style:normal;color:var(--gold)}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:72px}
.act:active{transform:scale(.97)}
.act b{font-size:14px}
.act small{color:var(--muted);font-size:11.5px}
.act[disabled]{opacity:.35;pointer-events:none}
.act .eff{font-size:12px;color:var(--green)}

/* log */
.log{font-size:13.5px}
.log div{padding:7px 0;border-bottom:1px solid var(--line);color:#cfd5e2}
.log div:last-child{border-bottom:0}
.log em{font-style:normal;color:var(--muted);font-size:12px;margin-right:6px}

/* ladder */
.ladder{margin-top:8px}
.lv{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.lv .dot{width:26px;height:26px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;margin-top:1px}
.lv.cur .dot{background:var(--gold);color:#1b1405}
.lv.done .dot{background:rgba(52,211,153,.25);color:var(--green)}
.lv .req{font-size:12px;color:var(--muted)}
.ok{color:var(--green)} .no{color:var(--red)}

/* next month */
#nextBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--safe-b));z-index:30;width:min(calc(100% - 32px),688px);padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--gold),#e8a93a);color:#1b1405;font-weight:800;font-size:16.5px;box-shadow:0 8px 30px rgba(245,196,81,.25)}
#nextBtn:active{transform:translateX(-50%) scale(.98)}
#nextBtn small{display:block;font-weight:600;font-size:11.5px;opacity:.75}

/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(16,19,26,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;letter-spacing:-.2px;color:var(--muted);padding:4px 0}
.tab span{font-size:22px;filter:grayscale(1);opacity:.65}
.tab.on{color:var(--gold)}
.tab.on span{filter:none;opacity:1}

/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
#modal .sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + var(--safe-b));border-top:1px solid var(--line);animation:up .22s ease-out}
@media(min-width:600px){#modal{align-items:center}#modal .sheet{border-radius:22px}}
#modal h3{margin:12px 0 6px;font-size:19px}
#modal p{margin:6px 0;color:#cfd5e2}
.grab{width:40px;height:5px;border-radius:3px;background:#39415a;margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rep{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.rep td{padding:6px 0;border-bottom:1px solid var(--line)}
.rep td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rep tr.tot td{border-bottom:0;font-size:15.5px;font-weight:800;padding-top:10px}

#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%) translateY(-120px);z-index:90;background:#232a3b;border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;transition:transform .25s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* start */
#start{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto}
#start .wrap{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 16px) 18px 30px}
#start h1{font-size:32px;margin:16px 0 4px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.field{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;margin:6px 0 12px;-webkit-user-select:text;user-select:text}
.avs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.avs button{width:56px;height:56px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:26px}
.avs button.on{border-color:var(--gold)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.opt.on{border-color:var(--gold)}
.opt b{display:block}
.opt span{color:var(--muted);font-size:13px}
.goal{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .ic{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.goal.done .ic{background:rgba(52,211,153,.18)}
.goal.done b{color:var(--green)}
.spark{width:100%;height:90px;display:block}
.amtrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.updbar{position:fixed;left:12px;right:12px;top:calc(var(--safe-t) + 10px);z-index:95;background:#1f2a44;border:1px solid var(--gold);border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.updbar .btn{flex:none}
.amtlbl{display:block;margin-top:12px;font-size:13px;font-weight:700;color:var(--gold)}
.amtrow .field{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.amtrow .field{margin:0;flex:1;min-width:0;padding:9px 12px;font-size:16px}
.upg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.up{display:flex;flex-direction:column;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0}
.up[disabled]{opacity:1;pointer-events:none}
.up:not(.done)[disabled] .upi{filter:grayscale(.8) brightness(.6)}
.up.done{border-color:rgba(52,211,153,.6)}
.upi{aspect-ratio:16/10;overflow:hidden;background:#232b40}
.upi img,.upi .emo{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:24px}
.upt{padding:6px 8px 8px}
.upt b{display:block;font-size:12px;line-height:1.25}
.upt small{color:var(--muted);font-size:11px}
.up.done small{color:var(--green)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:10px}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{font-size:16px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--gold);color:#1b1405}
.credit{font-size:11.5px;color:var(--muted);text-align:center;margin-top:20px}

/* персонаж */
.c-svg{width:100%;height:100%;display:block;overflow:visible}
.c-eyes{transform-box:view-box;transform-origin:80px 64px;animation:blink 4.6s infinite}
.c-head{transform-box:view-box;transform-origin:80px 112px;animation:tilt 6s ease-in-out infinite}
.c-armR{transform-box:view-box;transform-origin:124px 132px}
.c-armR.wave{animation:wave 1.4s ease-in-out infinite}
.c-armL{transform-box:view-box;transform-origin:36px 132px;animation:swing 2.6s ease-in-out infinite}
.c-talk{opacity:0}
.talking .c-talk{animation:talk .22s steps(1) infinite}
.talking .c-smile{opacity:0}
.c-crown{transform-box:view-box;transform-origin:80px 20px;animation:glow 2.2s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wave{0%,100%{transform:rotate(-140deg)}50%{transform:rotate(-170deg)}}
@keyframes swing{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
@keyframes talk{0%{opacity:1}50%{opacity:0}}
.ava svg,.avs svg{width:100%;height:100%}
.ava{overflow:hidden;background:linear-gradient(135deg,#34426a,#1a2033)}
.avs button{overflow:hidden;padding:2px}
/* 2,5D-слои сцены */
.layer{position:absolute;inset:0;will-change:transform}
.l-bg{transform:translate3d(calc(var(--px,0) * -10px),calc(var(--py,0) * -6px),0) scale(1.08)}
.l-mid{transform:translate3d(calc(var(--px,0) * -20px),calc(var(--py,0) * -8px),0);pointer-events:none}
.l-front{transform:translate3d(calc(var(--px,0) * -32px),calc(var(--py,0) * -10px),0);pointer-events:none}
.ride .tilt{position:absolute;inset:0;transform:perspective(700px) rotateY(-14deg) rotateX(4deg);transform-origin:left center}
.badge{position:absolute;width:44px;height:44px;border-radius:50%;overflow:hidden;border:2.5px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.5);z-index:4;animation:float 3.2s ease-in-out infinite;background:#232b40}
.badge img,.badge .emo{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:20px}
/* анимированная сцена */
#scene{max-width:720px;margin:0 auto;padding:14px 16px 0}
.scene{position:relative;height:300px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#141a29;isolation:isolate}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.slide.on{opacity:1}
.slide img,.slide .emo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 16s ease-in-out infinite alternate}
.slide .emo{display:flex;align-items:center;justify-content:center;font-size:90px;background:radial-gradient(circle at 30% 20%,#3a4670,#151b2c 70%)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.16) translate(-2%,-1.5%)}}
.scene-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.7));pointer-events:none}
.scene-tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.scene-dots{position:absolute;top:16px;right:12px;display:flex;gap:5px}
.scene-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .4s}
.scene-dots i.on{background:#fff;width:18px;border-radius:4px}
.char{position:absolute;left:10px;bottom:14px;width:118px;height:194px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55));z-index:3}
.char.cold{animation:shiver .35s linear infinite}
.char .crown{position:absolute;top:-30px;left:50%;font-size:38px;transform:translateX(-50%) rotate(-10deg);animation:glow 2.2s ease-in-out infinite}
.char-shadow{position:absolute;left:24px;bottom:12px;width:90px;height:14px;border-radius:50%;background:rgba(0,0,0,.5);animation:shad 2.6s ease-in-out infinite;z-index:2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shad{0%,100%{transform:scaleX(1);opacity:.55}50%{transform:scaleX(.8);opacity:.35}}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #ffd76a)}50%{filter:drop-shadow(0 0 14px #ffd76a)}}
.bubble{position:absolute;left:118px;top:46px;max-width:52%;background:#fff;color:#141824;padding:8px 12px;border-radius:16px 16px 16px 4px;font-size:13px;font-weight:600;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:4;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.bling span{position:absolute;font-size:26px;z-index:4;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.ride{position:absolute;right:12px;bottom:14px;width:44%;max-width:220px;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.85);box-shadow:0 12px 26px rgba(0,0,0,.55);z-index:3;animation:drive 1.3s cubic-bezier(.2,.8,.2,1) both,idle 4s ease-in-out 1.3s infinite}
.ride img,.ride .emo{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:40px;background:#232b40}
.ride .lbl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:11.5px;font-weight:700;padding:10px 7px 4px}
.walk{position:absolute;right:12px;bottom:14px;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:999px;font-size:12px;z-index:3}
@keyframes drive{from{transform:translateX(140%)}to{transform:none}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){.slide img,.slide .emo,.char,.char-shadow,.badge,.ride,.c-eyes,.c-head,.c-armR,.c-armL,.c-crown{animation:none!important}}

</style>
</head>
<body>

<header class="top hidden" id="top"></header>
<section id="scene" class="hidden"></section>
<main id="view"></main>
<button id="nextBtn" class="hidden" data-a="next">Следующий месяц ▸</button>
<nav class="tabs hidden" id="tabs">

  const it = ITEM[a.id];
  if(it.cat === 'biz' && a.ups && a.ups.length) return [BIZ_UPG[a.id][a.ups[a.ups.length - 1]][1], ...it.img];

function bizUpgrade(uid, i){
  const a = S.assets.find(x => x.uid === uid); if(!a) return;
  a.ups = a.ups || [];
  if(a.ups.includes(i)) return;
  const cost = upCost(a, i), u = UPG[i], [name, img] = BIZ_UPG[a.id][i];
  if(S.money < cost){ toast('Не хватает денег'); return; }
  S.money -= cost;
  a.ups.push(i);
  a.value *= 1 + u.value;
  logMsg(`${u.emoji} ${ITEM[a.id].name}: ${name} (−${money(cost).slice(1)})`);
  modalQueue.push({title:'Бизнес преобразился!', img:[img, ...ITEM[a.id].img], emoji:u.emoji, html:`<p><b>${esc(ITEM[a.id].name)}</b>: ${esc(name)}.</p><p>Прибыль <b class="ok">+${Math.round(u.profit * 100)}%</b>, стоимость бизнеса <b class="ok">+${Math.round(u.value * 100)}%</b>.</p>`, choices:[{label:'Отлично!', cls:'pri'}]});
  sfx('buy');
  showModal(); afterChange();
}

const $ = s => document.querySelector(s);
const clamp = (v, a=0, b=100) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function gauss(){ let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(n, sign=false){
  if(!isFinite(n)) n = 0;
  const neg = n < 0, a = Math.abs(n);
  let s;
  if(a < 10000) s = Math.round(a).toLocaleString('ru-RU');
  else if(a < 999500) s = trim(a/1e3) + ' тыс.';
  else if(a < 999500000) s = trim(a/1e6) + ' млн';
  else s = trim(a/1e9) + ' млрд';
  return (neg ? '−' : (sign && n > 0 ? '+' : '')) + '$' + s;
}
function trim(x){
  let s = x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2);
  if(s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s.replace('.', ',');
}

function photo(ids, emoji, cls='r169', tag=''){
  ids = ids || [];
  const tagHtml = tag ? `<div class="tag ${tag.cls||''}">${tag.text}</div>` : '';
  if(!ids.length) return `<div class="ph ${cls}"><div class="emo">${emoji}</div>${tagHtml}</div>`;
  return `<div class="ph ${cls}">${imgTag(ids, emoji, 'lazy')}${tagHtml}</div>`;
}
function imgTag(ids, emoji, loading){
  return `<img src="${PX(ids[0])}" data-alt="${esc(ids.slice(1).join('|'))}" data-emo="${emoji}" ${loading ? 'loading="lazy"' : ''} alt="" onerror="imgErr(this)">`;
}
function imgErr(img){
  const alt = (img.dataset.alt || '').split('|').filter(Boolean);
  if(alt.length){ img.dataset.alt = alt.slice(1).join('|'); img.src = PX(alt[0]); return; }
  const d = document.createElement('div'); d.className = 'emo'; d.textContent = img.dataset.emo || '✨';
  img.replaceWith(d);
}

function actionCheck(a){
  if(S.energy < a.en) return 'Не хватает энергии';
  const cost = actionCost(a);
  if(cost > 0 && S.money < cost) return 'Не хватает денег';
  const r = a.req;
  if(r){
    const miss = [];
    if(r.car && !personalCar()) miss.push('своя машина (не в аренде)');
    if(r.item && !owns(r.item)) miss.push(ITEM[r.item].name);
    if(r.smarts && S.smarts < r.smarts) miss.push('🧠 ' + r.smarts);
    if(r.charisma && S.charisma < r.charisma) miss.push('😎 ' + r.charisma);
    if(miss.length) return 'Нужно: ' + miss.join(', ');
  }
  if(a.id === 'casino' && S.money < 10) return 'Нужно хотя бы $10';
  return '';
}
const personalCar = () => S.assets.filter(x => ITEM[x.id].cat === 'cars' && x.mode !== 'rent').sort((a, b) => b.value - a.value)[0];
function actionCost(a){
  if(a.cost === 'charity') return Math.max(100, Math.round(Math.max(0, netWorth()) * 0.01));
  if(a.cost === 'roulette') return Math.max(10, Math.round(Math.max(0, S.money) * 0.02));
  return a.cost || 0;
}

function doAction(id){
  const a = ACT[id];
  const why = actionCheck(a);
  if(why){ toast(why); return; }
  S.energy -= a.en;
  const cost = actionCost(a);
  if(cost) S.money -= cost;
  let msg = '';
  if(a.money){
    let base = a.money === 'stream' ? 150 + S.fame * 40 : a.money;
    if(id === 'courier' && owns('bike')) base *= 1.4;
    if(id === 'busker') base += rint(0, 250);
    const earned = Math.round(base * rnd(0.85, 1.15));
    S.money += earned; msg = `${a.emoji} ${a.name}: ${money(earned, true)}`;
    if(id === 'taxi' || id === 'delivery'){ const car = personalCar(); if(car) car.cond = clamp(car.cond - 2); }
  }
  if(id === 'resell'){
    const back = rint(150, 1100);
    S.money += back;
    msg = back >= 500 ? `👟 Кроссовки ушли за ${money(back)} — прибыль ${money(back - 500, true)}` : `👟 Пришлось сбросить за ${money(back)} — убыток ${money(back - 500)}`;
  }
  if(RISKY[id]) msg = RISKY[id](cost);
  const e = a.eff || {};
  if(typeof e.smarts === 'number') S.smarts = clamp(S.smarts + e.smarts);
  if(e.health) S.health = clamp(S.health + e.health);
  if(e.happy) S.happy = clamp(S.happy + e.happy);
  if(e.fame === 'charity') S.fame = clamp(S.fame + Math.min(6, 1 + Math.log10(cost) * 0.8));
  else if(e.fame) S.fame = clamp(S.fame + e.fame);
  if(e.smarts === 'read') S.smarts = clamp(S.smarts + 2 * (1 - S.smarts / 130));
  if(e.charisma === 'speech') S.charisma = clamp(S.charisma + 2.5 * (1 - S.charisma / 130));
  else if(e.charisma) S.charisma = clamp(S.charisma + e.charisma);
  if(!msg) msg = `${a.emoji} ${a.name}` + (cost ? ` (−${money(cost).slice(1)})` : '');

  if(id === 'party' && chance(0.1)){ S.health = clamp(S.health - 6); msg += ' — перебрали, утром болит голова (−6 ❤️)'; }
  if(id === 'lottery'){
    const r = Math.random();
    if(r < 1/1500){ S.money += 250000; msg = '🎟️ ДЖЕКПОТ! Вы выиграли $250 000!'; S.happy = clamp(S.happy + 30); }
    else if(r < 1/40){ S.money += 100; msg = '🎟️ Выигрыш $100'; }
    else msg = '🎟️ Билет без выигрыша';
  }
  if(id === 'casino'){
    const bet = Math.max(10, Math.round(S.money * 0.1));
    if(chance(0.47)){ S.money += bet; msg = `🎰 Красное! Выигрыш ${money(bet, true)}`; S.happy = clamp(S.happy + 4); }
    else { S.money -= bet; msg = `🎰 Чёрное… Проигрыш ${money(-bet)}`; S.happy = clamp(S.happy - 4); }
  }
  logMsg(msg); toast(msg);
  afterChange();
}

function workHard(){

function promoReasons(){
  const tr = TRACK[S.job.track], nl = S.job.level + 1;
  if(nl >= tr.levels.length) return ['Вы уже на вершине этой карьеры'];
  const lv = tr.levels[nl], out = [];
  if(S.job.perf < 70) out.push(`Эффективность ${Math.round(S.job.perf)}% (нужно 70%)`);
  if(S.job.months < (lv.m || 0)) out.push(`Стаж ${S.job.months} мес. (нужно ${lv.m})`);
  reqList(lv.req).filter(r => !r.ok).forEach(r => out.push(r.text));
  return out;
}
function askPromotion(){
  if(!S.job) return;
  const why = promoReasons();
  if(why.length){
    modalQueue.push({title:'Повышение пока невозможно', emoji:'📋', html:'<p>Чего не хватает:</p><p>' + why.map(w => '• ' + esc(w)).join('<br>') + '</p>', choices:[{label:'Понятно'}]});
    showModal(); return;
  }
  promote('🎉 Повышение!');
}
function promote(prefix){
  const tr = TRACK[S.job.track];
  S.job.level++; S.job.perf = Math.max(50, S.job.perf - 15); S.job.months = 0;
  const lv = tr.levels[S.job.level];
  S.job.t = lv.t;
  S.happy = clamp(S.happy + 10); S.fame = clamp(S.fame + 1);
  if(S.job.level === tr.levels.length - 1) S.topReached = true;
  logMsg(`${prefix} Новая должность: ${lv.t}, ${money(lv.s)}/мес`);
  modalQueue.push({title:prefix, img:tr.img, emoji:tr.emoji, html:`<p>Теперь вы — <b>${esc(lv.t)}</b>.</p><p>Зарплата: <b class="ok">${money(lv.s)}</b> в месяц.</p>`, choices:[{label:'Отлично!'}]});
  checkGoals(); showModal(); afterChange();
}
function apply(tid, li){
  if(!canApply(tid, li)){ toast('Требования не выполнены'); return; }
  const tr = TRACK[tid], lv = tr.levels[li];
  const doIt = () => {
    S.job = {track:tid, level:li, t:lv.t, perf:60, months:0, shifts:0, yShifts:0, yMonth:0};
    if(li === tr.levels.length - 1) S.topReached = true;
    S.energy = Math.min(S.energy, maxEnergy());
    logMsg(`👷 Вы устроились: ${lv.t} (${money(lv.s)}/мес)`);
    toast(`Вы приняты: ${lv.t}`);
    checkGoals(); afterChange();
  };
  if(S.job){
    modalQueue.push({title:'Сменить работу?', emoji:'🔁', html:`<p>Вы уйдёте с должности «${esc(TRACK[S.job.track].levels[S.job.level].t)}» и начнёте как «${esc(lv.t)}».</p>`, choices:[{label:'Сменить', cls:'pri', fn:doIt}, {label:'Отмена'}]});
    showModal();
  } else doIt();
}
function quitJob(){
  if(!S.job) return;
  modalQueue.push({title:'Уволиться?', emoji:'🚪', html:'<p>Зарплата перестанет приходить, стаж обнулится.</p>', choices:[{label:'Уволиться', cls:'red', fn:()=>{ logMsg('🚪 Вы уволились с работы'); S.job = null; afterChange(); }}, {label:'Остаться'}]});

}
function enroll(id){
  const e = EDUM[id];
  if(S.study){ toast('Вы уже учитесь'); return; }
  if(S.edu.includes(id)){ toast('Уже окончено'); return; }
  if(!meets(e.req)){ toast('Не выполнены требования'); return; }
  if(S.money < e.cost){ toast('Нужно оплатить первый месяц: ' + money(e.cost)); return; }
  S.study = {id, done:0};
  S.energy = Math.min(S.energy, maxEnergy());
  logMsg(`${e.emoji} Вы поступили: ${e.name}`);
  toast('Вы поступили на обучение');
  afterChange();
}

/* покупки */
function buy(id, mortgage=false){
  const it = ITEM[id], price = curPrice(it);
  if(countOwned(id) >= LIMIT[it.cat]){ toast('Достигнут лимит: ' + LIMIT[it.cat] + ' шт.'); return; }
  let pay = price, loan = 0;
  if(mortgage){
    pay = Math.ceil(price * 0.2); loan = price - pay;
    if(loan > creditAvail()){ toast('Банк не одобрил ипотеку'); return; }
  }
  if(S.money < pay){ toast('Не хватает денег'); return; }
  S.money -= pay; S.debt += loan;
  const a = {uid:S.uid++, id, value:price, cond:100, mode:'idle', bought:S.t};
  S.assets.push(a);
  const p = it.p || (it.comfort ? it.comfort * 0.6 : 0);
  S.happy = clamp(S.happy + Math.min(15, 2 + p));
  S.fame = clamp(S.fame + p * 0.3);
  if(it.gain && it.gain.charisma) S.charisma = clamp(S.charisma + it.gain.charisma);
  logMsg(`🛍️ Куплено: ${it.name} за ${money(price)}` + (loan ? ` (ипотека ${money(loan)})` : ''));
  sfx('buy');
  closeModal();
  // предложить заселиться, если живёт хуже
  if(it.cat === 'realty' && it.comfort > homeComfort()){
    modalQueue.push({title:'Поздравляем с покупкой!', img:it.img, emoji:it.emoji, html:`<p>${esc(it.name)} теперь ваша. Переехать сюда или сдавать в аренду за ~${money(rentEstimate(a))}/мес?</p>`,
      choices:[{label:'Переехать', cls:'pri', fn:()=>setMode(a.uid, 'live')}, {label:'Сдавать в аренду', cls:'grn', fn:()=>setMode(a.uid, 'rent')}, {label:'Решу потом'}]});
    showModal();
  } else toast('Куплено: ' + it.name);
  checkGoals(); afterChange();
}
function sell(uid){
  const a = S.assets.find(x => x.uid === uid); if(!a) return;
  const it = ITEM[a.id], price = sellPrice(a);
  modalQueue.push({title:`Продать «${it.name}»?`, img:it.img, emoji:it.emoji, html:`<p>Вы получите <b class="ok">${money(price)}</b>.</p>`, choices:[
    {label:'Продать', cls:'red', fn:()=>{
      S.assets = S.assets.filter(x => x.uid !== uid);
      S.money += price;
      if(S.home.type === 'own' && S.home.uid === uid){ S.home = {type:'rent', id:'street'}; logMsg('⚠️ Вы продали жильё, в котором жили, и оказались на улице'); }
      logMsg(`💵 Продано: ${it.name} за ${money(price)}`);
      afterChange();
    }}, {label:'Отмена'}]});
  showModal();
}
function setMode(uid, mode){
  const a = S.assets.find(x => x.uid === uid); if(!a) return;
  const it = ITEM[a.id];
  if(mode === 'live'){
    if(it.cat !== 'realty') return;
    S.assets.forEach(x => { if(x.mode === 'live') x.mode = 'idle'; });
    a.mode = 'live'; S.home = {type:'own', uid};
    logMsg(`🏠 Вы переехали: ${it.name}`);
  } else {
    if(a.mode === 'live'){ S.home = {type:'rent', id:'street'}; logMsg('⚠️ Вы съехали из своего жилья. Найдите, где жить!'); }
    a.mode = mode;
    if(mode === 'rent') logMsg(`📃 Сдаётся в аренду: ${it.name}`);
  }
  checkGoals(); afterChange();
}
function repair(uid){
  const a = S.assets.find(x => x.uid === uid); if(!a) return;
  const cost = repairCost(a);
  if(S.money < cost){ toast('Не хватает денег на ремонт'); return; }
  S.money -= cost; a.cond = 100;
  logMsg(`🔧 Ремонт: ${ITEM[a.id].name} (−${money(cost).slice(1)})`);
  afterChange();
}
const repairCost = a => Math.round(a.value * (100 - a.cond) / 100 * 0.12);
/* ремонт всего сразу: сначала то, что в худшем состоянии */
const needRepair = () => S.assets.filter(a => !['acc', 'biz'].includes(ITEM[a.id].cat) && a.cond < 100 && repairCost(a) > 0).sort((a, b) => a.cond - b.cond);
function repairAll(){
  const list = needRepair();
  if(!list.length){ toast('Всё и так в идеальном состоянии'); return; }
  const total = list.reduce((s, a) => s + repairCost(a), 0);
  let budget = Math.max(0, S.money), can = [];
  for(const a of list){ const c = repairCost(a); if(c <= budget){ can.push(a); budget -= c; } }
  if(!can.length){ toast('Не хватает денег даже на один ремонт'); return; }
  const canSum = can.reduce((s, a) => s + repairCost(a), 0);
  const full = can.length === list.length;
  modalQueue.unshift({title:'Отремонтировать всё?', emoji:'🔧', html:`<p>${full ? `Будет отремонтировано <b>${list.length}</b> ${list.length === 1 ? 'объект' : list.length < 5 ? 'объекта' : 'объектов'} за <b class="no">${money(total)}</b>` : `На всё нужно ${money(total)}, а у вас ${money(S.money)}. Можно сразу починить <b>${can.length} из ${list.length}</b> (самые изношенные) за <b class="no">${money(canSum)}</b>`}</p>
    <p class="sub">${can.map(a => `${ITEM[a.id].emoji} ${esc(ITEM[a.id].name)} — ${Math.round(a.cond)}% → 100%, ${money(repairCost(a))}`).join('<br>')}</p>`,
    choices:[{label:`🔧 Отремонтировать за ${money(canSum)}`, cls:'pri', fn:()=>{
      can.forEach(a => { const c = repairCost(a); S.money -= c; a.cond = 100; });
      logMsg(`🔧 Ремонт ${can.length} объектов за ${money(canSum)}`);
      toast(`Отремонтировано: ${can.length}`);
      afterChange();
    }}, {label:'Отмена'}]});
  showModal();
}
function rentEstimate(a){ const it = ITEM[a.id]; return Math.round((it.rent || 0) * (a.value / it.price) * (0.55 + 0.45 * a.cond / 100)); }

function setHome(id){

  if(r.rent > 0 && S.money < r.rent){ toast('Нужна сумма на месяц аренды: ' + money(r.rent)); return; }

/* инвестиции и кредит */
/* разбор суммы из поля ввода: «2500», «10 000», «15к», «1,5 млн», «2m» */
function parseAmount(str){
  let t = String(str || '').toLowerCase().replace(/[\s\u00a0$]/g, '').replace(',', '.');
  if(!t) return NaN;
  let k = 1;
  const suf = [[/(млрд|b)$/, 1e9], [/(млн|м|m)$/, 1e6], [/(тыс\.?|к|k)$/, 1e3]];
  for(const [re, mul] of suf) if(re.test(t)){ k = mul; t = t.replace(re, ''); break; }
  if(!/^\d*\.?\d+$/.test(t)) return NaN;
  return Math.round(parseFloat(t) * k);
}
function readAmount(id){
  const el = document.getElementById(id);
  const v = parseAmount(el && el.value);
  if(!(v > 0)){ toast('Введите сумму, например 2500 или 15к'); if(el) el.focus(); return 0; }
  return v;
}
function invBuy(kind, amt){
  if(amt === 'all') amt = Math.floor(S.money);
  if(amt <= 0 || S.money < amt){ toast('Не хватает денег'); return; }
  const h = S.inv[kind];
  h.u += amt / h.p; h.cost += amt; S.money -= amt;
  toast(`Куплено на ${money(amt)}`);
  afterChange();
}
function invSell(kind, frac){
  const h = S.inv[kind];
  if(h.u <= 0) return;
  const u = h.u * frac, val = u * h.p;
  h.cost *= (1 - frac); h.u -= u; if(frac === 1){ h.u = 0; h.cost = 0; }
  S.money += val;
  toast(`Продано на ${money(val)}`);
  afterChange();
}
/* вклады: ставка годовых, капитализация ежемесячно, досрочно не снять */
const DEP_TERMS = [{m:3, r:0.04}, {m:6, r:0.055}, {m:12, r:0.07}, {m:24, r:0.085}, {m:60, r:0.10}];
let DEPTERM = 12;
const depFinal = (amt, t) => amt * Math.pow(1 + t.r / 12, t.m);
function depOpen(amt){
  const t = DEP_TERMS.find(x => x.m === DEPTERM);
  if(amt === 'all') amt = Math.floor(S.money);
  if(amt < 100){ toast('Минимальный вклад — $100'); return; }
  if(S.money < amt){ toast('Не хватает денег'); return; }
  const ok = () => {
    S.money -= amt;
    S.deposits.push({amt, start:amt, rate:t.r, months:t.m, left:t.m, opened:S.t});
    logMsg(`🏦 Открыт вклад ${money(amt)} на ${t.m} мес. под ${(t.r * 100).toFixed(1).replace('.', ',')}% годовых`);
    toast('Вклад открыт');
    afterChange();
  };
  modalQueue.unshift({title:'Открыть вклад?', emoji:'🏦', html:`<p>${money(amt)} на <b>${t.m} мес.</b> под <b>${(t.r * 100).toFixed(1).replace('.', ',')}%</b> годовых с ежемесячной капитализацией.</p><p>В конце срока вы получите <b class="ok">${money(depFinal(amt, t))}</b>.</p><p class="sub">⚠️ Досрочно забрать деньги нельзя.</p>`,
    choices:[{label:'Открыть вклад', cls:'pri', fn:ok}, {label:'Отмена'}]});
  showModal();
}
function loanTake(amt){
  amt = Math.min(amt, creditAvail());
  if(amt < 100){ toast('Банк отказал'); return; }
  S.debt += amt; S.money += amt;
  logMsg(`🏦 Кредит: +${money(amt).slice(1)}`);
  afterChange();
}
function loanRepay(amt){
  if(amt === 'all') amt = S.debt;
  amt = Math.min(amt, S.debt, Math.max(0, S.money));
  if(amt <= 0){ toast('Нечем гасить'); return; }
  S.debt -= amt; S.money -= amt;
  if(S.debt < 1) S.debt = 0;
  toast('Кредит погашен на ' + money(amt));
  afterChange();
}

/* =========================================================
   СЛЕДУЮЩИЙ МЕСЯЦ
   ========================================================= */
function nextMonth(){
  if(!S || S.dead) return;
  const R = {inc:[], exp:[], notes:[]};
  const add = (arr, name, v) => { if(Math.round(v) !== 0) arr.push([name, Math.round(v)]); };
  let passive = 0;

  // --- работа
  if(S.job){
    const tr = TRACK[S.job.track], lv = tr.levels[S.job.level];
    add(R.inc, `💼 Зарплата: ${lv.t} (${Math.round(S.job.perf)}% от ${money(baseSalary())})`, salary());
    S.job.months++;
    const shifts = S.job.shifts || 0;
    let dp = shifts > 0 ? 3 : -1;
    S.job.shifts = 0;
    S.job.yMonth = (S.job.yMonth || 0) + 1;
    if(S.job.yMonth >= 12){
      const done = S.job.yShifts || 0;
      if(done < YEAR_SHIFTS){
        const pen = (YEAR_SHIFTS - done) * MISS_PENALTY;
        dp -= pen;
        logMsg(`📉 Годовой план смен не выполнен (${done}/${YEAR_SHIFTS}): эффективность −${pen}%`);
        modalQueue.push({title:'Годовой план провален', emoji:'📉', html:`<p>За рабочий год вы отработали <b>${done}</b> из ${YEAR_SHIFTS} смен.</p><p>Эффективность снижена на <b class="no">${pen}%</b>. При нуле — увольнение.</p>`, choices:[{label:'Исправлюсь'}]});
      } else {
        dp += 5;
        logMsg(`✅ Годовой план смен выполнен (${done}/${YEAR_SHIFTS}): эффективность +5%`);
      }
      S.job.yShifts = 0; S.job.yMonth = 0;
    }
    if(S.happy < 20) dp -= 4;
    if(S.health < 30) dp -= 3;
    if(S.home.type === 'rent' && S.home.id === 'street') dp -= 3;
    S.job.perf = clamp(S.job.perf + dp);
    if(tr.id === 'show') S.fame = clamp(S.fame + 0.4 + S.job.level * 0.35);
    if(tr.id === 'blog') S.fame = clamp(S.fame + 0.5 + S.job.level * 0.35);
    if(tr.id === 'build' || tr.id === 'fin' || tr.id === 'law') S.charisma = clamp(S.charisma + 0.15);
    if(tr.id === 'it' || tr.id === 'med' || tr.id === 'fin') S.smarts = clamp(S.smarts + 0.15);
    // работа на реквизитах уровня (например, нужен телефон или жильё)
    if(!meets(lv.req)){
      S.job.perf = clamp(S.job.perf - 15);
    }
  }
  // --- учёба
  if(S.study){
    const e = EDUM[S.study.id];
    add(R.exp, '🎓 Обучение: ' + e.name, -e.cost);
    S.study.done++;
    if(S.study.done >= e.months){
      S.edu.push(e.id);
      if(e.gain.smarts) S.smarts = clamp(S.smarts + e.gain.smarts);
      if(e.gain.charisma) S.charisma = clamp(S.charisma + e.gain.charisma);
      S.happy = clamp(S.happy + 8);
      S.study = null;
      logMsg(`🎓 Вы окончили: ${e.name}!`);
      modalQueue.push({title:'Учёба окончена!', emoji:e.emoji, html:`<p>Вы получили документ: <b>${esc(e.name)}</b>. Новые карьерные двери открыты.</p>`, choices:[{label:'Ура!'}]});
    }
  }
  // --- жильё и быт
  if(S.home.type === 'rent'){
    const r = RENTAL[S.home.id];
    if(r.rent) add(R.exp, '🏠 Аренда: ' + r.name, -r.rent);
  }
  const ls = LIFESTYLES.find(l => l.id === S.lifestyle);
  add(R.exp, `${ls.emoji} Жизнь (${ls.name})`, -ls.cost);

  // --- активы
  let rentSum = 0, maintSum = 0, bizSum = 0, prestige = 0;
  const bizN = {};
  const reShock = 0.003 + gauss() * 0.008;
  S.reIdx = clamp(S.reIdx * (1 + reShock), 0.4, 50);
  for(const a of S.assets){
    const it = ITEM[a.id];
    // стоимость
    if(['realty','commerce'].includes(it.cat)) a.value *= (1 + reShock);
    else if(it.cat === 'biz') a.value *= (1 + 0.002 + gauss() * 0.01);
    else a.value *= (1 + (it.drift || 0) + (it.vol ? gauss() * it.vol : 0));
    a.value = Math.max(1, a.value);
    if(it.cat === 'biz'){
      const mg = 0.75 + (S.smarts + S.charisma) / 400;
      bizN[a.id] = (bizN[a.id] || 0) + 1;
      const compet = Math.pow(0.85, bizN[a.id] - 1); // каждая следующая точка того же бизнеса приносит меньше
      let pr = bizProfitEst(a) * mg * compet * (1 + gauss() * it.vol);
      if(chance(0.06)) pr = -it.profit * rnd(0.2, 0.6);
      bizSum += pr;
      continue;
    }
    if(it.maint) maintSum += it.maint * (a.value / it.price);
    if(it.cat === 'acc'){ prestige += it.p || 0; continue; }
    if(a.mode === 'rent'){
      const occ = chance(0.07) ? 0 : rnd(0.85, 1.05);
      if(!occ) R.notes.push(`🔍 «${it.name}» простаивал без арендатора`);
      rentSum += rentEstimate(a) * occ;
      a.cond = clamp(a.cond - (it.wear || 1) * rnd(0.6, 1.4));
    } else {
      a.cond = clamp(a.cond - (it.wear || 1) * (a.mode === 'live' ? 0.4 : 0.15));
      prestige += it.p || 0;
    }
  }
  if(rentSum) add(R.inc, '📃 Аренда имущества', rentSum);
  if(bizSum) add(bizSum > 0 ? R.inc : R.exp, '🏪 Прибыль бизнеса', bizSum);
  if(maintSum) add(R.exp, '🔧 Содержание имущества', -maintSum);
  passive = rentSum + bizSum - maintSum;

  // --- кредит
  if(S.debt > 0){
    const interest = S.debt * 0.009;
    S.debt += interest;
    const pay = Math.min(S.debt, Math.max(50, S.debt * 0.02));
    S.debt -= pay;
    add(R.exp, '🏦 Платёж по кредиту', -pay);
    if(S.debt < 1) S.debt = 0;
  }

  // --- вклады: сложный процент, капитализация каждый месяц
  S.deposits = (S.deposits || []).filter(d => {
    d.amt *= 1 + d.rate / 12;
    d.left--;
    if(d.left > 0) return true;
    S.money += d.amt;
    R.notes.push(`🏦 Вклад закрыт: вернулось ${money(d.amt)} (вложено ${money(d.start)}, доход ${money(d.amt - d.start, true)})`);
    logMsg(`🏦 Вклад на ${d.months} мес. закрыт: ${money(d.amt)}`);
    return false;
  });

  // --- применяем деньги
  const incTotal = R.inc.reduce((s, x) => s + x[1], 0);
  const expTotal = R.exp.reduce((s, x) => s + x[1], 0);
  S.money += incTotal + expTotal;
  S.lastIncome = incTotal;
  S.lastPassive = Math.round(passive);

  // --- инвестиции
  const st = S.inv.stocks, cr = S.inv.crypto;
  const p0s = st.p, p0c = cr.p;
  st.p = Math.max(1, st.p * Math.exp(0.006 + gauss() * 0.045));
  cr.p = Math.max(0.5, cr.p * Math.exp(0.008 + gauss() * 0.17));

  // --- здоровье, счастье, слава
  const comfort = homeComfort();
  S.happy += comfort * 0.5 - 2 + ls.happy + Math.min(5, prestige * 0.08) + (S.job ? 0.5 : 0); // быт и стресс
  if(!S.job && age() > 22 && netWorth() < 1e6) S.happy -= 1.5;
  S.health += ls.health - 0.7; // естественный износ организма
  if(S.home.type === 'rent' && S.home.id === 'street') S.health -= 4;
  if(S.happy < 15) S.health -= 1;
  const ag = age();
  if(ag >= 40) S.health -= 0.15;
  if(ag >= 55) S.health -= 0.35;
  if(ag >= 70) S.health -= 0.6;
  if(ag >= 85) S.health -= 1.2;
  if(S.health < 45 && !(S.home.type === 'rent' && S.home.id === 'street') && ag < 60 && ls.id !== 'eco') S.health += 0.4;
  S.fame = S.fame + Math.min(1.5, prestige * 0.015) - 0.25;
  S.happy += (50 - S.happy) * 0.04; // настроение слегка стремится к норме
  S.health = clamp(S.health); S.happy = clamp(S.happy); S.fame = clamp(S.fame);

  // --- отрицательный баланс
  if(S.money < 0){
    S.negMonths++;
    S.happy = clamp(S.happy - 5);
    if(S.negMonths >= 3) seizeAssets();
    else logMsg(`⚠️ Минус на счёте (${S.negMonths}/3). Через ${3 - S.negMonths} мес. придут коллекторы!`);
  } else S.negMonths = 0;

  // --- увольнение за плохую работу
  if(S.job && S.job.perf <= 0){
    logMsg(`📉 Вас уволили за низкую эффективность (${TRACK[S.job.track].levels[S.job.level].t})`);
    modalQueue.push({title:'Вас уволили', emoji:'📉', html:'<p>Эффективность упала до нуля. Следите за здоровьем, настроением и жильём.</p>', choices:[{label:'Эх…'}]});
    S.job = null;
  }

  // --- время
  S.t++;
  if(S.t % 12 === 0) logMsg(`🎂 Вам исполнилось ${age()}!`);
  S.energy = maxEnergy();

  // --- отложенные события
  S.pending = S.pending.filter(p => {
    if(S.t >= p.at){ runPending(p); return false; }
    return true;
  });

  S.lastReport = {inc:R.inc, exp:R.exp, notes:R.notes, total:incTotal + expTotal, stocks:st.p / p0s - 1, crypto:cr.p / p0c - 1};
  S.hist.push(Math.round(netWorth()));
  if(S.hist.length > 360) S.hist.shift();

  // --- события
  randomEvents();
  workFines();
  checkGoals();

  // --- смерть
  if(S.health <= 0 || age() >= 100){
    S.dead = true;
    gameOver();
    return;
  }
  save();
  showReport();
  render();
}

function seizeAssets(){
  const lost = [];
  while(S.money < 0 && S.assets.length){
    const asc = [...S.assets].sort((a, b) => sellPrice(a) - sellPrice(b));
    const a = asc.find(x => sellPrice(x) * 0.7 >= -S.money) || asc[asc.length - 1];
    const v = Math.round(sellPrice(a) * 0.7);
    S.money += v;
    S.assets = S.assets.filter(x => x.uid !== a.uid);
    if(S.home.type === 'own' && S.home.uid === a.uid) S.home = {type:'rent', id:'street'};
    lost.push(ITEM[a.id].name);
  }
  if(S.money < 0 && invValue() > 0){
    S.money += invValue() * 0.9; S.inv.stocks.u = S.inv.crypto.u = 0; S.inv.stocks.cost = S.inv.crypto.cost = 0; lost.push('инвестиции');
  }
  if(S.money < 0){ S.debt += -S.money; S.money = 0; lost.push('долг переоформлен в кредит'); }
  S.negMonths = 0;
  S.happy = clamp(S.happy - 15);
  logMsg('🚨 Коллекторы: ' + (lost.length ? lost.join(', ') : 'ничего не нашли'));
  modalQueue.push({title:'Пришли коллекторы', emoji:'🚨', html:`<p>Три месяца в минусе. Изъято и продано за бесценок: <b>${esc(lost.join(', ') || '—')}</b>.</p>`, choices:[{label:'Понятно'}]});
}

function runPending(p){
  if(p.type === 'friendBack'){
    if(p.ok){ S.money += p.amt; logMsg(`🤝 Друг вернул долг с процентами: ${money(p.amt, true)}`); modalQueue.push({title:'Друг вернул долг', emoji:'🤝', html:`<p>Как и обещал, с благодарностью: <b class="ok">${money(p.amt)}</b>.</p>`, choices:[{label:'Приятно!'}]}); }
    else { logMsg('🙈 Друг так и не вернул долг'); S.happy = clamp(S.happy - 4); }
  }
  if(p.type === 'startup'){
    if(p.ok){ S.money += p.amt; logMsg(`🚀 Стартап выстрелил! Ваша доля: ${money(p.amt, true)}`); modalQueue.push({title:'Стартап выстрелил!', emoji:'🚀', html:`<p>Компанию купила корпорация. Вы получаете <b class="ok">${money(p.amt)}</b>.</p>`, choices:[{label:'Йес!'}]}); }
    else { logMsg('💥 Стартап, в который вы вложились, обанкротился'); modalQueue.push({title:'Стартап закрылся', emoji:'💥', html:'<p>Деньги потеряны. Таков венчур.</p>', choices:[{label:'Бывает'}]}); }
  }
}

function workFines(){
  if(!S.job || salary() <= 0) return;

  if(!chance(p)) return;
  const pool = WORK_FINES.filter(f => !f.test || f.test());
  let r = Math.random() * pool.reduce((a, f) => a + f.w, 0), ev = pool[pool.length - 1];
  for(const f of pool){ r -= f.w; if(r <= 0){ ev = f; break; } }
  const m = ev.run(); if(m) modalQueue.push(m);
}

function randomEvents(){
  if(!chance(0.42)) return;
  const pool = EVENTS.filter(e => { try{ return e.test(); }catch(_){ return false; } });
  if(!pool.length) return;
  let tot = pool.reduce((s, e) => s + e.w, 0), r = Math.random() * tot;
  let ev = pool[pool.length - 1];
  for(const e of pool){ r -= e.w; if(r <= 0){ ev = e; break; } }
  const m = ev.run();
  if(m) modalQueue.push(m);
}

/* =========================================================
   МУЗЫКА: генеративный lounge / джаз / блюз на Web Audio.
   Аккорды электропиано, бас, щётки и тарелки, импровизация.
   ========================================================= */
const MUSIC_KEY = 'uphill_music';
const STYLES = {
  lounge:{name:'Lounge', bpm:84, swing:0.5,
    prog:[[48,55,59,62,64],[45,52,55,59,60],[50,57,60,64,65],[43,53,57,59,64]], // Cmaj9 Am9 Dm9 G13
    scale:[72,74,76,79,81,84]},
  jazz:{name:'Джаз', bpm:116, swing:0.64,
    prog:[[50,57,60,65],[43,53,59,64],[48,55,59,64],[45,55,61,64]], // Dm9 G13 Cmaj7 A7
    scale:[72,74,76,77,79,81,83,84]},
  blues:{name:'Блюз', bpm:78, swing:0.67,
    prog:[[45,55,61,64],[45,55,61,64],[45,55,61,64],[45,55,61,64],[50,60,66,69],[50,60,66,69],[45,55,61,64],[45,55,61,64],[52,62,68,71],[50,60,66,69],[45,55,61,64],[52,62,68,71]], // 12 тактов в A
    scale:[69,72,74,75,76,79,81]},
};
const MUSIC = {ctx:null, out:null, on:true, style:'lounge', next:0, step:0, timer:0, noise:null};
try{ const m = JSON.parse(localStorage.getItem(MUSIC_KEY) || 'null'); if(m){ MUSIC.on = !!m.on; if(STYLES[m.style]) MUSIC.style = m.style; } }catch(e){}
const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);
function musicSave(){ try{ localStorage.setItem(MUSIC_KEY, JSON.stringify({on:MUSIC.on, style:MUSIC.style})); }catch(e){} }
function audioInit(){
  if(MUSIC.ctx) return MUSIC.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  const ctx = new AC();
  const out = ctx.createGain(); out.gain.value = 0.22;
  const comp = ctx.createDynamicsCompressor();
  const delay = ctx.createDelay(1); delay.delayTime.value = 0.32;
  const fb = ctx.createGain(); fb.gain.value = 0.28;
  const wet = ctx.createGain(); wet.gain.value = 0.22;
  out.connect(comp); out.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(comp);
  comp.connect(ctx.destination);
  const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  Object.assign(MUSIC, {ctx, out, noise:buf});
  return ctx;
}
function envGain(t, a, dur, peak){
  const g = MUSIC.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  return g;
}
function epNote(n, t, dur, vel){ // электропиано: синус + обертон + мягкий фильтр
  const c = MUSIC.ctx, g = envGain(t, 0.01, dur, vel), f = c.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 2400;
  [[1, 1], [2, 0.18], [3.01, 0.05]].forEach(([m, v]) => {
    const o = c.createOscillator(), og = c.createGain();
    o.type = m === 1 ? 'triangle' : 'sine'; o.frequency.value = midiHz(n) * m; og.gain.value = v;
    o.connect(og); og.connect(f); o.start(t); o.stop(t + dur + 0.05);
  });
  f.connect(g); g.connect(MUSIC.out);
}
function bassNote(n, t, dur, vel=0.5){
  const c = MUSIC.ctx, o = c.createOscillator(), g = envGain(t, 0.008, dur, vel), f = c.createBiquadFilter();
  o.type = 'triangle'; o.frequency.value = midiHz(n); f.type = 'lowpass'; f.frequency.value = 520;
  o.connect(f); f.connect(g); g.connect(MUSIC.out); o.start(t); o.stop(t + dur + 0.05);
}
function drum(kind, t, vel=0.3){
  const c = MUSIC.ctx;
  if(kind === 'kick'){
    const o = c.createOscillator(), g = envGain(t, 0.003, 0.28, vel);
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.2);
    o.connect(g); g.connect(MUSIC.out); o.start(t); o.stop(t + 0.3); return;
  }
  const s = c.createBufferSource(), f = c.createBiquadFilter();
  s.buffer = MUSIC.noise;
  const len = kind === 'ride' ? 0.35 : kind === 'brush' ? 0.18 : 0.05;
  f.type = kind === 'brush' ? 'bandpass' : 'highpass'; f.frequency.value = kind === 'brush' ? 1800 : kind === 'ride' ? 6500 : 8000;
  const g = envGain(t, kind === 'brush' ? 0.02 : 0.002, len, vel);
  s.connect(f); f.connect(g); g.connect(MUSIC.out); s.start(t, Math.random() * 0.5); s.stop(t + len + 0.02);
}
/* один шаг = восьмая; 8 шагов = такт */
function musicStep(i, t, beat){
  const st = STYLES[MUSIC.style], bar = Math.floor(i / 8), pos = i % 8;
  const ch = st.prog[bar % st.prog.length], root = ch[0] - 12;
  if(MUSIC.style === 'jazz'){
    if(pos % 2 === 0){ // шагающий бас четвертями
      const walk = [root, root + 4, root + 7, root + (Math.random() < 0.5 ? 9 : 6)];
      bassNote(walk[pos / 2], t, beat * 0.9, 0.45);
      drum('ride', t, 0.08);
    }
    if(pos === 3 || pos === 7) drum('ride', t, 0.06);
    if(pos === 2 || pos === 6) drum('brush', t, 0.07);
    if(pos === 3 || (pos === 6 && Math.random() < 0.5)) ch.slice(1).forEach(n => epNote(n, t, beat * 1.2, 0.05));
  } else if(MUSIC.style === 'blues'){
    const pat = [0, 7, 9, 7]; // буги-шаффл
    if(pos % 2 === 0) bassNote(root + pat[pos / 2], t, beat * 0.8, 0.45);
    drum('hat', t, pos % 2 ? 0.04 : 0.07);
    if(pos === 0 || pos === 4) drum('kick', t, 0.25);
    if(pos === 2 || pos === 6) drum('brush', t, 0.1);
    if(pos === 1 || pos === 5) ch.slice(1).forEach(n => epNote(n, t, beat * 0.6, 0.045));
  } else { // lounge: босса-нова
    const bpat = {0:root, 3:root + 7, 4:root + 7, 7:root};
    if(bpat[pos] !== undefined) bassNote(bpat[pos], t, beat * 0.7, 0.42);
    drum('hat', t, 0.035);
    if(pos === 0 || pos === 4) drum('kick', t, 0.18);
    if(pos === 3 || pos === 6) drum('brush', t, 0.06);
    if(pos === 0 || pos === 3 || pos === 5) ch.slice(1).forEach(n => epNote(n, t, beat * (pos === 0 ? 1.8 : 0.9), 0.04));
  }
  // импровизация: редкие ноты из лада поверх аккордов
  if(Math.random() < (MUSIC.style === 'blues' ? 0.3 : 0.22)){
    const n = pick(st.scale) + (Math.random() < 0.15 ? -12 : 0);
    epNote(n, t, beat * (Math.random() < 0.3 ? 1.5 : 0.6), 0.06);
  }
}
function musicTick(){
  const c = MUSIC.ctx; if(!c) return;
  const st = STYLES[MUSIC.style], beat = 60 / st.bpm, eighth = beat / 2;
  while(MUSIC.next < c.currentTime + 0.25){
    const off = MUSIC.step % 2 ? (st.swing - 0.5) * beat : 0; // свинг: задерживаем слабые восьмые
    musicStep(MUSIC.step, MUSIC.next + off, beat);
    MUSIC.next += eighth; MUSIC.step++;
  }
}
function musicStart(){
  if(!MUSIC.on) return;
  const c = audioInit(); if(!c) return;
  if(c.state === 'suspended') c.resume();
  if(MUSIC.timer) return;
  MUSIC.next = c.currentTime + 0.1; MUSIC.step = 0;
  MUSIC.timer = setInterval(musicTick, 60);
}
function musicStop(){ clearInterval(MUSIC.timer); MUSIC.timer = 0; }
function musicToggle(){
  MUSIC.on = !MUSIC.on; musicSave();
  if(MUSIC.on) musicStart(); else musicStop();
  if(S) render();
}
function musicStyle(x){ MUSIC.style = x; MUSIC.step = 0; musicSave(); if(S) render(); }
function sfx(kind){
  if(!MUSIC.on || !MUSIC.ctx) return;
  const t = MUSIC.ctx.currentTime + 0.01;
  if(kind === 'coin'){ epNote(88, t, 0.25, 0.08); epNote(93, t + 0.08, 0.35, 0.08); }
  if(kind === 'buy'){ [76, 79, 84].forEach((n, i) => epNote(n, t + i * 0.07, 0.4, 0.07)); }
  if(kind === 'bad'){ epNote(52, t, 0.5, 0.08); epNote(51, t + 0.15, 0.6, 0.08); }
}
document.addEventListener('visibilitychange', () => {
  if(!MUSIC.ctx) return;
  if(document.hidden) MUSIC.ctx.suspend(); else if(MUSIC.on) MUSIC.ctx.resume();
});

function spark(){
  const h = S.hist.slice(-120);
  if(h.length < 2) return '<div class="sub">График появится через пару месяцев.</div>';
  const mn = Math.min(...h, 0), mx = Math.max(...h, 1), W = 300, H = 90;
  const pts = h.map((v, i) => `${(i / (h.length - 1) * W).toFixed(1)},${(H - 4 - (v - mn) / (mx - mn || 1) * (H - 8)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#f5c451" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

   АНИМИРОВАННАЯ СЦЕНА НА ГЛАВНОЙ
   ========================================================= */
let sceneSig = '', sceneIdx = 0;
const PERSONAL_SCENE_CATS = ['island', 'water', 'air'];
function sceneSlides(){
  const [himg, hemo] = homeImg();
  const out = [{img:himg, emoji:hemo, label:'🏠 ' + homeName()}];
  S.assets.filter(a => PERSONAL_SCENE_CATS.includes(ITEM[a.id].cat) && a.mode !== 'rent')
    .sort((a, b) => b.value - a.value).slice(0, 4)
    .forEach(a => { const it = ITEM[a.id]; out.push({img:it.img, emoji:it.emoji, label:it.emoji + ' ' + it.name}); });
  return out;
}
function moodLine(){
  const nw = netWorth();
  if(S.home.type === 'rent' && S.home.id === 'street') return pick(['Холодно… Нужна хоть какая-то крыша', 'Сегодня опять на лавочке', 'Главное — заработать на хостел']);
  if(S.money < 0) return 'Долги душат. Надо срочно что-то делать';
  if(S.health < 30) return 'Что-то мне нехорошо… Пора к врачу';
  if(S.job && yearNeed() > 0 && yearLeft() <= 2) return `До конца рабочего года ${yearLeft()} мес., а смен ${S.job.yShifts || 0}/${YEAR_SHIFTS}. Надо пахать!`;
  if(S.job && S.job.perf < 25) return 'Начальник косо смотрит. Надо поднажать';
  if(S.happy < 25) return 'Как-то тоскливо… Может, отдохнуть?';
  if(!S.job && nw < 1e5) return 'Пора найти нормальную работу';
  if(nw >= 1e9) return pick(['Миллиард — есть! 👑', 'Куда бы слетать на выходные?', 'Может, купить ещё один остров?']);
  if(nw >= 1e6) return pick(['Жизнь удалась 😎', 'Деньги должны работать', 'Следующая цель — остров']);
  return pick(['Шаг за шагом — в гору!', 'Сегодня отличный день для успеха', 'Каждый месяц — новая ступень', 'Однажды у меня будет яхта']);
}
function updateScene(){
  const el = $('#scene');
  const slides = sceneSlides();
  const car = personalCar();
  const acc = [...new Set(S.assets.filter(a => ITEM[a.id].cat === 'acc').map(a => a.id))].slice(0, 6);
  const o = outfit();
  const cold = S.home.type === 'rent' && S.home.id === 'street';
  const wave = !cold && S.happy >= 55;
  const sig = JSON.stringify([S.avatar, slides.map(x => x.label), car && car.uid, acc, o, cold, wave]);
  if(sig !== sceneSig){
    sceneSig = sig;
    if(sceneIdx >= slides.length) sceneIdx = 0;
    const pos = [[130,148],[130,98],[130,48],[182,148],[232,148],[282,148]];
    el.innerHTML = `<div class="scene">
      <div class="layer l-bg">${slides.map((sl, i) => `<div class="slide ${i === sceneIdx ? 'on' : ''}" data-label="${esc(sl.label)}">${sl.img && sl.img.length ? imgTag(sl.img, sl.emoji) : `<div class="emo">${sl.emoji}</div>`}</div>`).join('')}</div>
      <div class="scene-grad"></div>
      <div class="layer l-mid">${car ? `<div class="ride"><div class="tilt">${imgTag(ITEM[car.id].img, ITEM[car.id].emoji)}<div class="lbl">${esc(ITEM[car.id].name)}</div></div></div>` : `<div class="walk">🚶 Пока пешком</div>`}</div>
      <div class="layer l-front">
        <div class="char-shadow"></div>
        <div class="char ${cold ? 'cold' : ''}">${charSVG(S.avatar, {wave, outfit:o})}</div>
        ${acc.map((id, i) => `<span class="badge" style="left:${pos[i][0]}px;bottom:${pos[i][1]}px;animation-delay:${i * 0.45}s">${imgTag(ITEM[id].img, ITEM[id].emoji)}</span>`).join('')}
      </div>
      <div class="scene-tag">${esc(slides[sceneIdx].label)}</div>
      ${slides.length > 1 ? `<div class="scene-dots">${slides.map((_, i) => `<i class="${i === sceneIdx ? 'on' : ''}"></i>`).join('')}</div>` : ''}
      <div class="bubble"></div>
    </div>`;
    const sc = el.querySelector('.scene');
    const move = e => {
      const r = sc.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
      sceneTouch = Date.now();
      sc.style.setProperty('--px', ((p.clientX - r.left) / r.width * 2 - 1).toFixed(3));
      sc.style.setProperty('--py', ((p.clientY - r.top) / r.height * 2 - 1).toFixed(3));
    };
    sc.addEventListener('pointermove', move);
    sc.addEventListener('touchmove', move, {passive:true});
  }
  const b = el.querySelector('.bubble');
  const key = String(S.t) + '/' + Math.round(S.energy) + '/' + (S.job ? S.job.shifts : '');
  if(b && b.dataset.t !== key){
    b.dataset.t = key;
    b.textContent = moodLine();
    b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    const ch = el.querySelector('.char');
    if(ch){ ch.classList.add('talking'); clearTimeout(talkT); talkT = setTimeout(() => ch.classList.remove('talking'), 1600); }
  }
}
let talkT = 0, sceneTouch = 0;
/* плавное «покачивание камеры», когда пальцем не водят — эффект 2,5D */
(function sway(t){
  const sc = document.querySelector('#scene .scene');
  if(sc && Date.now() - sceneTouch > 2500 && !$('#scene').classList.contains('hidden')){
    sc.style.setProperty('--px', (Math.sin(t / 2600) * 0.55).toFixed(3));
    sc.style.setProperty('--py', (Math.sin(t / 3900) * 0.35).toFixed(3));
  }
  requestAnimationFrame(sway);
})(0);
setInterval(() => {
  const el = $('#scene');
  if(!S || el.classList.contains('hidden') || document.hidden) return;
  const slides = el.querySelectorAll('.slide');
  if(slides.length < 2) return;
  slides[sceneIdx % slides.length].classList.remove('on');
  sceneIdx = (sceneIdx + 1) % slides.length;
  slides[sceneIdx].classList.add('on');
  el.querySelectorAll('.scene-dots i').forEach((d, i) => d.classList.toggle('on', i === sceneIdx));
  const tag = el.querySelector('.scene-tag'); if(tag) tag.textContent = slides[sceneIdx].dataset.label;
}, 5000);

/* =========================================================
   СТАРТОВЫЙ ЭКРАН
   ========================================================= */
let startAvatar = '👩‍🦰', startMode = 'hard';
function showStart(){
  const saved = load();
  ['#top', '#tabs', '#nextBtn', '#scene'].forEach(s => $(s).classList.add('hidden'));
  $('#view').innerHTML = ''; $('#scene').innerHTML = ''; sceneSig = '';
  const st = $('#start'); st.classList.remove('hidden');
  st.innerHTML = `<div class="wrap">
    ${photo([26859048, 31817156, 'fb:house'], '🏝️', 'hero')}
    <h1>UpHill</h1>
    <p class="sub">Текстовый симулятор жизни. Начните на улице без копейки и станьте миллиардером: карьера, недвижимость, машины, яхты, самолёты и собственный остров.</p>
    ${saved ? `<button class="btn pri full" style="margin:10px 0 18px;min-height:52px;font-size:16px" data-a="continue">▶ Продолжить: ${esc(saved.name)}, ${saved.startAge + Math.floor(saved.t / 12)} лет</button><h3>Или новая жизнь</h3>` : ''}
    <label class="sub">Имя героя</label>
    <input class="field" id="nm" maxlength="24" placeholder="Например, Ламар" value="">
    <label class="sub">Аватар</label>
    <div class="avs">${AVATAR_KEYS.map(a => `<button class="${a === startAvatar ? 'on' : ''}" data-a="sa" data-x="${a}">${charSVG(a, {head:true, outfit:{tier:1}})}</button>`).join('')}</div>
    <label class="sub">Старт</label>
    <button class="opt ${startMode === 'hard' ? 'on' : ''}" data-a="sm" data-x="hard"><b>🥶 С самого дна</b><span>$0, улица, никаких связей. Самый крутой подъём в гору.</span></button>
    <button class="opt ${startMode === 'easy' ? 'on' : ''}" data-a="sm" data-x="easy"><b>🎒 Скромный старт</b><span>$1 500 и койка в хостеле. Немного проще.</span></button>
    <button class="btn pri full" style="margin-top:10px;min-height:52px;font-size:17px" data-a="begin">Начать жизнь</button>
    <div class="credit">Все предметы, жильё и карьеры — с реальными фото.<br>Сохранение — автоматически в браузере. Версия ${APP_VERSION}</div>
  </div>`;
}
function beginGame(){
  const nm = ($('#nm').value || '').trim() || 'Ламар';
  if(load()){
    modalQueue.unshift({title:'Начать заново?', emoji:'⚠️', html:'<p>Текущее сохранение будет удалено.</p>', choices:[{label:'Да, новая жизнь', cls:'red', fn:()=>startNew(nm)}, {label:'Отмена'}]});
    closeModal(true); showModal();
  } else startNew(nm);
}
function startNew(nm){
  newGame(nm, startAvatar, startMode);
  enterGame();
  modalQueue.push({title:`Привет, ${nm}!`, emoji:startMode === 'hard' ? '🥶' : '🎒', html:`<p>Каждый ход — это месяц. За месяц у вас есть запас <b>энергии ⚡</b> на подработки, учёбу, спорт и отдых.</p>
    <p>1. Заработайте на подработках и снимите жильё.<br>2. Устройтесь на работу и растите по карьерной лестнице.<br>3. Покупайте недвижимость, машины и бизнес — и сдавайте в аренду.<br>4. Цель — <b>$1 000 000 000</b>, яхта и собственный остров.</p>`, choices:[{label:'Поехали!', cls:'pri'}]});
  showModal();
}
function enterGame(){
  $('#start').classList.add('hidden'); $('#start').innerHTML = '';
  ['#top', '#tabs', '#nextBtn'].forEach(s => $(s).classList.remove('hidden'));
  TAB = 'life';
  render();
  window.scrollTo(0, 0);
}

/* =========================================================
   ПРОВЕРКА ОБНОВЛЕНИЙ: Safari и иконка «Домой» могут показывать
   старую копию из кэша — сверяем версию с сайтом.
   ========================================================= */
let updShown = false;
function checkUpdate(manual){
  if(!/^https?:/.test(location.protocol)){ if(manual) toast('Проверка работает только на сайте, а не в файле'); return; }
  fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.text() : '')
    .then(t => {
      const m = t.match(/APP_VERSION = '([\d.]+)'/);
      if(m && m[1] !== APP_VERSION){
        if(updShown) return; updShown = true;
        const bar = document.createElement('div');
        bar.className = 'updbar';
        bar.innerHTML = `Вышла новая версия ${m[1]} (у вас ${APP_VERSION}). Прогресс сохранится. <button class="btn sm pri" id="updgo">Обновить</button>`;
        document.body.appendChild(bar);
        document.getElementById('updgo').onclick = () => location.replace(location.pathname + '?v=' + m[1]);
      } else if(manual) toast(`У вас последняя версия ${APP_VERSION}`);
    })
    .catch(() => { if(manual) toast('Нет связи с сайтом'); });
}
setTimeout(() => checkUpdate(false), 1500);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(false); });

/* =========================================================
   ОБРАБОТКА НАЖАТИЙ
   ========================================================= */
const H = {
  tab:x => { TAB = x; render(); window.scrollTo(0, 0); },
  next:() => {
    if(modalOpen) return;
    if(S.job && (S.job.yMonth || 0) >= 11 && yearNeed() > 0){
      const can = Math.min(yearNeed(), Math.floor(S.energy / 25), MAX_SHIFTS - (S.job.shifts || 0));
      const ch = [];
      if(can > 0) ch.push({label:`💪 Отпахать ${can} ${can === 1 ? 'смену' : can < 5 ? 'смены' : 'смен'} и дальше`, cls:'pri', fn:()=>{ for(let i = 0; i < can; i++) workHard(); nextMonth(); }});
      ch.push({label:`Всё равно дальше (−${yearNeed() * MISS_PENALTY}% эффективности)`, cls:'red', fn:()=>nextMonth()});
      ch.push({label:'Отмена'});
      modalQueue.unshift({title:'Последний месяц рабочего года', emoji:'📅', html:`<p>План — ${YEAR_SHIFTS} смен за год, отработано <b>${S.job.yShifts || 0}</b>. Не хватает ${yearNeed()}.</p><p>Если не добрать, эффективность упадёт на ${yearNeed() * MISS_PENALTY}%, а при нуле — увольнение.</p><p class="sub">Сейчас: ${Math.round(S.job.perf)}% · энергия ⚡${Math.round(S.energy)}</p>`, choices:ch});
      showModal(); return;
    }
    nextMonth();
  },
  act:x => doAction(x),
  hard:() => workHard(),
  promo:() => askPromotion(),
  quit:() => quitJob(),
  apply:x => { const [t, i] = x.split(':'); apply(t, +i); },
  grp:x => { OPEN_GROUPS[x] = !OPEN_GROUPS[x]; render(); },
  track:x => { OPEN_TRACK = OPEN_TRACK === x ? null : x; render(); },
  enroll:x => enroll(x),
  drop:() => dropOut(),
  cat:x => { SHOPCAT = x; render(); },
  acat:x => { ASSETCAT = x; render(); },
  music:() => musicToggle(),
  mstyle:x => musicStyle(x),
  bizup:x => { const [u, i] = x.split(':'); bizUpgrade(+u, +i); },
  buy:x => buy(x),
  mortgage:x => buy(x, true),
  sell:x => sell(+x),
  mode:x => { const [u, m] = x.split(':'); setMode(+u, m); },
  repair:x => repair(+x),
  repairall:() => repairAll(),
  housing:() => housingSheet(),
  home:x => setHome(x),
  ownhome:x => { closeModal(true); setMode(+x, 'live'); },
  life:x => setLifestyle(x),
  ib:x => { const [k, a] = x.split(':'); invBuy(k, a === 'all' ? 'all' : +a); },
  is:x => { const [k, f] = x.split(':'); invSell(k, +f); },
  lt:x => loanTake(+x),
  depterm:x => { DEPTERM = +x; render(); },
  dep:x => depOpen(x === 'all' ? 'all' : +x),
  checkupd:() => checkUpdate(true),
  ltx:() => { const v = readAmount('amt-loan'); if(!v) return; if(v > creditAvail()){ toast(`Банк одобрит максимум ${money(creditAvail())}`); return; } loanTake(v); },
  lrx:() => { const v = readAmount('amt-loan'); if(v) loanRepay(v); },
  depx:() => { const v = readAmount('amt-dep'); if(v) depOpen(v); },
  ibx:x => { const v = readAmount('amt-' + x); if(!v) return; if(v > S.money){ toast(`Не хватает денег: у вас ${money(S.money)}`); return; } invBuy(x, v); },
  isx:x => { const v = readAmount('amt-' + x); if(!v) return; const h = S.inv[x], val = h.u * h.p;
    if(val <= 0){ toast('Продавать нечего'); return; }
    if(v > val + 0.5) toast(`У вас только ${money(val)} — продаём всё`);
    invSell(x, Math.min(1, v / val)); },
  lr:x => loanRepay(x === 'all' ? 'all' : +x),
  choice:x => choose(+x),
  restart:() => { modalQueue.unshift({title:'Начать заново?', emoji:'⚠️', html:'<p>Весь прогресс будет потерян.</p>', choices:[{label:'Да, заново', cls:'red', fn:()=>{ wipe(); S = null; modalQueue = []; showStart(); }}, {label:'Отмена'}]}); showModal(); },
  // старт
  sa:x => { startAvatar = x; document.querySelectorAll('.avs button').forEach(b => b.classList.toggle('on', b.dataset.x === x)); },
  sm:x => { startMode = x; document.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', b.dataset.x === x)); },
  begin:() => beginGame(),
  continue:() => { const d = load(); if(d){ S = d; enterGame(); } },
};
document.addEventListener('click', e => {
  if(MUSIC.on && !MUSIC.timer && e.target.closest('[data-a]') && !e.target.closest('[data-a=music]')) musicStart(); // звук на iOS можно включить только после касания
  const b = e.target.closest('[data-a]');
  if(!b || b.disabled) return;
  const fn = H[b.dataset.a];
  if(fn) fn(b.dataset.x);
});
// Enter в поле суммы = нажать кнопку; предпросмотр дохода по вкладу
document.addEventListener('keydown', e => {
  const el = e.target;
  if(e.key !== 'Enter' || !el.dataset || !el.dataset.enter) return;
  e.preventDefault(); el.blur();
  const fn = H[el.dataset.enter]; if(fn) fn(el.dataset.x);
});
document.addEventListener('input', e => {
  if(e.target.dataset.preview !== 'dep') return;
  const v = parseAmount(e.target.value), out = document.getElementById('dep-preview');
  const t = DEP_TERMS.find(x => x.m === DEPTERM);
  out.innerHTML = v > 0 ? `${money(v)} через ${t.m} мес. превратятся в <b class="ok">${money(depFinal(v, t))}</b>${v > S.money ? ' <span class="no">· не хватает денег</span>' : ''}` : '';
});
// тап по фону модалки закрывает только информационные окна (без выбора)
$('#modal').addEventListener('click', e => {
  if(e.target.id !== 'modal') return;
  const m = $('#modal')._m;
  if(m && m.choices && m.choices.length === 1 && !m.choices[0].fn) choose(0);
});

showStart();
</script>
